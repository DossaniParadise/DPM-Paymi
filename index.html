<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  initializeFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(window.APP_CONFIG.firebase);
// Auto-detect long polling: corporate proxies and some browser extensions
// block Firestore's default streaming transport, which makes writes hang
// forever with no error. This falls back automatically.
const db  = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

// Exposed for the Babel-compiled script below (module scope is isolated).
window.FS = {
  db, collection, doc, addDoc, updateDoc, deleteDoc, setDoc,
  onSnapshot, query, orderBy, serverTimestamp
};
window.dispatchEvent(new Event("firebase-ready"));
</script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const CFG = window.APP_CONFIG;

// Human-readable role names. The AREA_COACH key is kept internally (it is in
// the directory mapping and in stored invoices) but is never shown to users —
// the org now calls this role District Manager.
const ROLE_LABELS = {
  ADMIN: "Admin", FINANCE: "Finance", DIRECTOR: "Director of Ops",
  AREA_COACH: "District Manager", VP: "VP of Ops", MANAGER: "Store Manager",
  RATE_REVIEWER: "Rate Reviewer", RATE_REVIEW: "Rate Verification"
};
function roleLabel(r) { return ROLE_LABELS[r] || (r || "").replace(/_/g, " "); }

/* ============================================================
   1. DIRECTORY ADAPTER
   Maps the alignment API onto the shapes the UI expects.
   Nothing is hardcoded: every approver is resolved from the API.
   ============================================================ */

// Division is not a field in the directory, so it is derived from the store
// name. Car Wash is tested FIRST — "Paradise Car Wash #1" would otherwise be
// caught by the Paradise/C-Store rule. Anything unmatched surfaces as
// "Unknown" rather than silently defaulting, so new store types get noticed.
function deriveDivision(storeName) {
  const n = (storeName || "").toLowerCase();
  if (n.includes("car wash")) return "Car Wash";
  if (n.startsWith("burger king") || n.startsWith("subway")) return "Fast Food";
  if (n.startsWith("paradise quick stop") ||
      n.startsWith("scarborough travel stop") ||
      n.startsWith("7-eleven")) return "C-Store";
  return "Unknown";
}

// The directory has two record generations:
//   newer DFW stores -> assignedAreaCoachId  (string, sometimes "")
//   older stores     -> assignedAreaCoachIds (array) AND the singular field
// Reading only the plural field silently drops the AC on ~45 DFW stores.
function readCoachIds(rest) {
  const plural = rest.assignedAreaCoachIds;
  if (Array.isArray(plural) && plural.length) return plural.filter(Boolean);
  const single = rest.assignedAreaCoachId;
  return single ? [single] : [];
}

const directoryService = {
  async load() {
    const bust = (CFG.directoryUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
    const res = await fetch(CFG.directoryUrl + bust, { cache: "no-store" });
    if (!res.ok) throw new Error("Directory API " + res.status);
    const data = await res.json();

    const coaches   = data.areaCoaches || {};
    const directors = data.directors   || {};
    const rests     = data.restaurants || {};
    // FindMi's Support Staff panel. FindMi still stores it under the legacy
    // `vps` key (the panel used to be "VP of Operations"), so that is what the
    // alignment API exposes. Records: { id, name, email, phone, jobTitle,
    // department, deptHead }.
    const staff     = data.vps || data.supportStaff || {};

    // Flat user map: id -> { id, name, email, role }
    const users = {};
    Object.values(directors).forEach(d => {
      users[d.id] = { id: d.id, name: d.name, email: (d.email || "").trim(), role: "DIRECTOR" };
    });
    Object.values(coaches).forEach(c => {
      // A person can appear as both; DIRECTOR already registered wins for role,
      // but we still want them selectable as an Area Coach approver.
      if (!users[c.id]) {
        users[c.id] = { id: c.id, name: c.name, email: (c.email || "").trim(), role: "AREA_COACH" };
      }
    });

    // The VP is resolved FROM the directory, not hardcoded: every FindMi record
    // (Support Staff, Director, DM) that carries the configured VP id or the
    // configured VP email belongs to him. His live name/email come from FindMi
    // (Support Staff record first), and every id found is an identity he may
    // sign under — so a Director step embedded under his director id and a VP
    // step embedded under CFG.vp.id are both "his".
    const vp = resolveVpFromDirectory({ staff, directors, coaches });
    RUNTIME.vpIds = vp.ids.slice();
    RUNTIME.vpName = vp.name;
    RUNTIME.vpEmail = vp.email;
    // Where new VP steps get embedded. Normally the configured id; if that id
    // is really another person's, fall back to his own directory record.
    RUNTIME.vpStepId = (vp.collision && vp.collision.id === CFG.vp.id)
      ? (vp.ids.find(id => id !== CFG.vp.directoryId) || ("vp:" + vp.email))
      : CFG.vp.id;
    if (!RUNTIME.vpIds.includes(RUNTIME.vpStepId)) RUNTIME.vpIds.push(RUNTIME.vpStepId);
    const stepId = RUNTIME.vpStepId;
    if (users[stepId]) {
      users[stepId].alsoVP = true;
      if (!users[stepId].email && vp.email) users[stepId].email = vp.email;
    } else {
      users[stepId] = { id: stepId, name: vp.name, email: vp.email, role: "VP" };
    }
    vp.ids.forEach(id => { if (users[id]) users[id].alsoVP = true; });

    // A store can point at a person who has since been DELETED from FindMi
    // (FindMi keeps the raw id but shows the slot as unassigned). Treat it the
    // same way here — a stale id is NOT an approver — and remember it so the
    // path-repair scan can explain what it was.
    const stores = Object.values(rests).map(r => ({
      id: r.id,
      name: r.storeName || "(unnamed)",
      storeNumber: r.storeNumber || "",
      division: deriveDivision(r.storeName),
      acIds: readCoachIds(r).filter(id => coaches[id]),
      staleAcIds: readCoachIds(r).filter(id => !coaches[id]),
      directorId: (r.assignedDirectorId && directors[r.assignedDirectorId]) ? r.assignedDirectorId : null,
      staleDirectorId: (r.assignedDirectorId && !directors[r.assignedDirectorId]) ? r.assignedDirectorId : "",
      storeManager: r.storeManager || "",
      email: r.email || "",          // store mailbox — managers sign in with this
      entity: r.entity || "",        // legal entity, e.g. "Al's Quick Stop Inc."
      address: r.address || ""
    })).sort((a, b) => a.name.localeCompare(b.name));

    // DPM Office: a virtual "store" for corporate invoices (rent, software,
    // HQ utilities…). It has no directory approvers — Finance picks the
    // approver chain per invoice on the upload screen.
    stores.push({
      id: OFFICE_STORE_ID, name: "DPM Office", storeNumber: "",
      entity: "Dossani Paradise Management", division: "Office",
      acIds: [], directorId: null, storeManager: "", email: ""
    });

    return { users, stores, staff, vp };
  }
};

/* Find the VP in the live directory. The EMAIL is the identity: every FindMi
   record (Support Staff first, then Directors and DMs) whose email equals the
   configured VP email — case-insensitive, trimmed — is his. The configured id
   is accepted too, but only when the record carrying it has no email or the
   same email; a record with that id and SOMEONE ELSE's email is a collision
   and is reported, never merged (that would hand another person's steps to
   the VP). Returns { ids, name, email, fromDirectory, collision }. Falls back
   to the config values only when FindMi has no record of him at all. */
function resolveVpFromDirectory({ staff, directors, coaches }) {
  const cfgEmail = (CFG.vp.email || "").trim().toLowerCase();
  const cfgIds = [CFG.vp.id, CFG.vp.directoryId].filter(Boolean);
  const matches = [];
  let collision = null;
  const consider = (rec, source) => {
    if (!rec || !rec.id) return;
    const email = (rec.email || "").trim().toLowerCase();
    const byEmail = !!cfgEmail && !!email && email === cfgEmail;
    const byId = cfgIds.includes(rec.id);
    if (byEmail || (byId && !email)) {
      matches.push({ id: rec.id, name: rec.name || "", email, source });
    } else if (byId && email !== cfgEmail) {
      collision = { id: rec.id, name: rec.name || "", email, source };
    }
  };
  Object.values(staff || {}).forEach(r => consider(r, "staff"));
  Object.values(directors || {}).forEach(r => consider(r, "director"));
  Object.values(coaches || {}).forEach(r => consider(r, "coach"));

  const primary = matches.find(m => m.source === "staff") || matches[0] || null;
  // The configured id is always one of his identities — that is the id VP
  // steps are embedded under — UNLESS it turned out to belong to someone else.
  const own = collision ? cfgIds.filter(id => id !== collision.id) : cfgIds;
  const ids = Array.from(new Set(own.concat(matches.map(m => m.id))));
  if (collision) {
    console.warn("[PayMi] CFG.vp.id " + collision.id + " belongs to " +
      (collision.name || "another person") + " (" + collision.email + ") in FindMi, " +
      "not to the VP. VP identity is resolved by email instead.");
  }
  return {
    ids,
    name:  (primary && primary.name)  || CFG.vp.name,
    email: (primary && primary.email) || cfgEmail,
    fromDirectory: !!primary,
    collision
  };
}

/* Every id the VP may act under (config ids + whatever FindMi resolved). */
function vpIdentityIds() {
  const ids = (RUNTIME.vpIds && RUNTIME.vpIds.length)
    ? RUNTIME.vpIds : [CFG.vp.id, CFG.vp.directoryId];
  return Array.from(new Set(ids.filter(Boolean)));
}
function isVpIdentity(id) { return !!id && vpIdentityIds().includes(id); }
// The id new VP steps are embedded under: the configured id, unless FindMi
// showed it belongs to someone else, in which case his Support Staff id.
function vpStepId() { return RUNTIME.vpStepId || CFG.vp.id; }
function vpDisplayName() { return RUNTIME.vpName || CFG.vp.name; }
function makeVpStep() {
  return {
    role: "VP", label: "VP of Ops",
    userIds: [vpStepId()], userId: vpStepId(), name: vpDisplayName(),
    note: "Invoice total $" + getVpThreshold().toLocaleString() + "+"
  };
}
// A step is "the VP's" when any of its approvers is one of his identities.
function stepIsVp(step) {
  return !!step && (step.userIds || [step.userId]).some(isVpIdentity);
}

/* ============================================================
   2. APPROVAL CHAINS — one INDEPENDENT chain per store.

   A 4-store invoice carries 4 chains. Each chain runs its own
   AC -> DO (-> VP) sequence with its own status, current stage,
   SLA clock, and history. One chain rejecting does not touch the
   others: 3 of 4 stores can approve while the 4th rejects, and
   Finance processes payment for the approved subset.

   Within a step, ANY listed user may approve (two-coach stores).
   The VP threshold applies to the invoice TOTAL, and when it
   triggers, the VP step appears in EVERY chain — so the VP can
   approve some stores and reject others.
   ============================================================ */

/* Vendor -> rate-review category: "IT" | "RAHIM" | "NONE".
   Firestore doc (config/vendorRules) wins; then the config seeds; then the
   default. Vendor names compare case-insensitively, trimmed. */
function vendorRuleFor(vendor, rulesDoc) {
  const v = (vendor || "").trim().toLowerCase();
  if (!v) return CFG.vendorRuleDefault;
  const fromDoc = rulesDoc && rulesDoc.rules && rulesDoc.rules[v];
  if (fromDoc) return fromDoc;
  if (CFG.vendorRuleSeeds[v]) return CFG.vendorRuleSeeds[v];
  return (rulesDoc && rulesDoc.default) || CFG.vendorRuleDefault;
}

// Who may sign the rate step. IT can act from the dedicated rate login OR
// their existing admin session (admin ids are "admin:<email>").
function rateReviewerIds(kind) {
  const r = CFG.rateReviewers[kind];
  if (!r) return null;
  const ids = [r.id];
  if (CFG.adminEmails.map(e => e.toLowerCase()).includes(r.email.toLowerCase()))
    ids.push("admin:" + r.email.toLowerCase());
  return { ids, name: r.name };
}

/* HOUSE RULE — the VP and the threshold.
   Sam (the VP) signs ONLY when the invoice total is at or above the live VP
   threshold. Under it he is never on a chain — not as the VP step, not as a
   stand-in, not as a fallback when a store is missing its DM or DO. A short
   chain (DM only, or DO only) is a complete chain: whoever FindMi still lists
   for the store approves it and that is enough. */
function vpRequired(amount) { return (Number(amount) || 0) >= getVpThreshold(); }

// Steps for ONE store. DM -> (rate check) -> DO -> VP when the total demands.
function buildStoreChainSteps(store, amount, users, vendorRule) {
  const steps = [];
  const nameOf = id => (users[id] && users[id].name) || "Unknown";
  // Under the VP threshold the VP is not an approver under ANY identity.
  const allowed = id => users[id] && (vpRequired(amount) || !isVpIdentity(id));

  const acIds = effectiveAcIds(store).filter(allowed);
  if (acIds.length) {
    steps.push({
      role: "AREA_COACH", label: "District Manager (DM)",
      userIds: acIds, userId: acIds[0],
      name: acIds.map(nameOf).join(" or "),
      note: "Has this work been completed?"
    });
  }

  // Rate verification: vendor-dependent second signer, before the DO.
  const reviewer = rateReviewerIds(vendorRule);
  if (reviewer) {
    steps.push({
      role: "RATE_REVIEW", label: "Rate Verification",
      userIds: reviewer.ids, userId: reviewer.ids[0],
      name: reviewer.name,
      note: "Is this rate correct?"
    });
  }

  const effDirId = effectiveDirectorId(store);
  if (effDirId && allowed(effDirId)) {
    // Per-Director threshold: skip the DO on small invoices — but ONLY when
    // a DM is on the chain. A Director who is the only approver always stays.
    const doMin = directorThresholdFor(effDirId);
    const skipDO = doMin > 0 && amount < doMin && acIds.length > 0;
    if (!skipDO) {
      const dirStep = {
        role: "DIRECTOR", label: "Director of Ops",
        userIds: [effDirId], userId: effDirId,
        name: nameOf(effDirId)
      };
      if (!acIds.length) dirStep.note = "No District Manager — starts here";
      steps.push(dirStep);
    }
  }

  if (vpRequired(amount)) {
    // Skip the duplicate VP step when he already appears in THIS chain under
    // any of his identities (e.g. picked as a stand-in), so the same person
    // isn't asked to sign twice.
    if (!steps.some(stepIsVp)) steps.push(makeVpStep());
  }
  return steps;
}

// Full chain objects for an invoice.
function buildChains(stores, amount, users, now, vendorRule) {
  return stores.map(st => {
    const steps = buildStoreChainSteps(st, amount, users, vendorRule);
    return {
      storeId: st.id,
      storeName: st.name,
      storeNumber: st.storeNumber || "",
      entity: st.entity || "",
      division: st.division || "",
      steps,
      status: steps.length ? "PENDING" : "REJECTED",   // unroutable store fails loudly
      currentStage: steps.length ? steps[0].role : "NONE",
      stageEnteredAt: steps.length ? now : null,
      history: []
    };
  });
}

// Normalized chains for ANY invoice. Legacy single-chain invoices (top-level
// requiredApprovals) are presented as one synthetic chain so old records
// render and route without migration.
function getChains(inv) {
  if (Array.isArray(inv.chains) && inv.chains.length) return inv.chains;
  if (Array.isArray(inv.requiredApprovals) && inv.requiredApprovals.length) {
    return [{
      _legacy: true,
      storeId: inv.storeId || "", storeName: inv.storeName || "",
      storeNumber: "", entity: "", division: inv.division || "",
      steps: inv.requiredApprovals,
      status: inv.status === "PAID" ? "APPROVED" : inv.status,
      currentStage: inv.currentStage,
      stageEnteredAt: inv.stageEnteredAt || null,
      history: inv.history || []
    }];
  }
  return [];
}

/* ============================================================
   COMMENT NOTIFICATIONS
   Each comment appends {ts, by} to a small commentLog on the
   invoice doc; commentReads holds each person's explicit
   mark-read timestamp. Both PayMi and the repair app compute
   unread identically from the invoice doc alone.
   Audience: everyone named in a PENDING or REJECTED chain.
   Your own comments never count as unread for you.
   ============================================================ */
/* One person can hold SEVERAL ids here — IT signs in as "admin:<email>" but is
   named in rate steps as "rate:it". Checking a single id meant the audience
   test failed for the identity you happened to sign in with, so the comment was
   invisible in PayMi and could never be marked read — while FixMi, which checks
   every id, kept insisting you had unread comments. Always resolve the full set. */
function identityIdsFor(user) {
  if (!user || !user.id) return [];
  const ids = [user.id];
  // Sessions that carry several directory ids (the VP: Support Staff record
  // + the id VP steps embed under + any other FindMi record with his email).
  (user.ids || []).forEach(id => { if (id && !ids.includes(id)) ids.push(id); });
  const email = (user.email || "").toLowerCase();
  if (email && (RUNTIME.vpEmail || "").toLowerCase() === email) {
    vpIdentityIds().forEach(id => { if (!ids.includes(id)) ids.push(id); });
  }
  // the rate-reviewer alias for this same human, and vice versa
  Object.values(CFG.rateReviewers || {}).forEach(r => {
    if (!r) return;
    if ((r.email || "").toLowerCase() === email) {
      if (!ids.includes(r.id)) ids.push(r.id);
      const adminId = "admin:" + (r.email || "").toLowerCase();
      if (!ids.includes(adminId)) ids.push(adminId);
    }
  });
  return ids;
}
function commentAudienceIncludes(userId, inv) {
  const ids = Array.isArray(userId) ? userId : [userId];
  return getChains(inv).some(c =>
    (c.status === "PENDING" || c.status === "REJECTED") &&
    (c.steps || []).some(st => (st.userIds || []).some(u => ids.includes(u))));
}

function unreadCommentsFor(userId, inv) {
  const ids = Array.isArray(userId) ? userId : [userId];
  if (!ids.length || !commentAudienceIncludes(ids, inv)) return 0;
  // Reading under ANY of my identities counts as read — mirrors FixMi's max().
  const readAt = Math.max(0, ...ids.map(id => (inv.commentReads || {})[id] || 0));
  return (inv.commentLog || []).filter(e =>
    e && !ids.includes(e.by) && (e.ts || 0) > readAt).length;
}

// Top-level invoice status derived from its chains.
//   any chain PENDING          -> PENDING (still in flight)
//   otherwise ≥1 APPROVED      -> APPROVED (finance pays that subset)
//   otherwise                  -> REJECTED
function deriveStatus(chains) {
  if (chains.some(c => c.status === "PENDING")) return "PENDING";
  return chains.some(c => c.status === "APPROVED") ? "APPROVED" : "REJECTED";
}

/* ============================================================
   APPROVAL PATH REPAIR
   People leave; FindMi gets updated; in-flight chains go stale.
   This rebuilds the CURRENT and FUTURE steps of every PENDING
   chain from the live directory. Rules:
   - Completed steps are history — never touched.
   - Approved / rejected / paid chains are records — never touched.
   - Rate Verification and VP steps are config, not directory —
     untouched (except VP dedupe below).
   - If the store no longer has a DM (or DO), that step is dropped
     and the chain waits on the next stage instead. A chain missing
     its DM or DO does NOT fall through to the VP: he joins only
     when the total is at/above the live VP threshold, same as any
     other chain. Under it, whoever is left (DM alone is enough)
     approves; if nobody is left and nobody has signed, the invoice
     is reported for a stand-in rather than routed to the VP or
     silently approved.
   - If the person the chain is CURRENTLY waiting on changed, the
     SLA clock restarts — the new approver gets a fresh window.
   - If the VP already signs the chain under another identity, the
     VP step is dropped so the same person isn't asked twice.
   - Stores missing from the directory are skipped and reported.
   ============================================================ */
function repairChainAgainstDirectory(chain, store, users, now, amount) {
  if (chain.status !== "PENDING") return null;
  if (!store) return { skipped: "store no longer in the directory — left unchanged" };

  const nameOf = id => (users[id] && users[id].name) || "Unknown";
  const curIdx = (chain.steps || []).findIndex(st => st.role === chain.currentStage);
  if (curIdx < 0) return { skipped: "current stage not found in its own steps — left unchanged" };

  const changes = [];
  let clockReset = false;
  const label = chain.storeName || store.name || "store";
  const amtNum = Number(amount) || 0;
  const needVp = vpRequired(amtNum);
  const thr = "$" + getVpThreshold().toLocaleString();
  // Under the VP threshold the VP is not an approver under ANY identity —
  // not as DM, not as DO, not as a Settings stand-in.
  const allowed = id => users[id] && (needVp || !isVpIdentity(id));

  // New Director id up-front, for the VP-dedupe rule. Effective = the
  // directory's Director, or the Settings stand-in for a store missing one.
  const effDir = effectiveDirectorId(store);
  const newDirId = effDir && allowed(effDir) ? effDir : null;
  const dirIsVpUnderThreshold = !!effDir && users[effDir] && !needVp && isVpIdentity(effDir);
  const effAcs = effectiveAcIds(store).filter(allowed);

  const newSteps = [];
  (chain.steps || []).forEach((step, idx) => {
    if (idx < curIdx) { newSteps.push(step); return; }   // history

    if (step.role === "AREA_COACH") {
      const ids = effAcs;
      if (!ids.length) {
        changes.push(label + ": District Manager step removed — no DM on this store now");
        return;                                          // dropped
      }
      const same = ids.length === (step.userIds || []).length &&
                   ids.every(id => (step.userIds || []).includes(id));
      if (same) { newSteps.push(step); return; }
      changes.push(label + ": District Manager " +
        (step.name || "?") + " → " + ids.map(nameOf).join(" or "));
      newSteps.push({ ...step, userIds: ids, userId: ids[0],
                      name: ids.map(nameOf).join(" or ") });
      return;
    }

    if (step.role === "DIRECTOR") {
      if (!newDirId) {
        let why = ": Director step removed — no Director on this store now";
        if (dirIsVpUnderThreshold) {
          why = ": Director step removed — " + nameOf(effDir) + " is the VP and $" +
            amtNum.toLocaleString() + " is under the " + thr + " VP threshold";
        } else if (stepIsVp(step) || isVpIdentity(store.staleDirectorId)) {
          why = ": Director step removed — it was routed to " + vpDisplayName() +
            " through a deleted FindMi Director record; he is the VP, not a Director, and joins only at " +
            thr + "+";
        } else if (store.staleDirectorId) {
          why = ": Director step removed — FindMi's Director for this store no longer exists";
        }
        changes.push(label + why);
        return;
      }
      const doMin = directorThresholdFor(newDirId);
      const hasDM = (chain.steps || []).some(st => st.role === "AREA_COACH");
      if (doMin > 0 && amtNum < doMin && hasDM) {
        changes.push(label + ": Director step removed — $" +
          amtNum.toLocaleString() + " is under " + nameOf(newDirId) +
          "'s $" + doMin.toLocaleString() + " threshold");
        return;
      }
      if ((step.userIds || []).includes(newDirId) && (step.userIds || []).length === 1) {
        newSteps.push(step); return;
      }
      changes.push(label + ": Director " + (step.name || "?") + " → " + nameOf(newDirId));
      newSteps.push({ ...step, userIds: [newDirId], userId: newDirId, name: nameOf(newDirId) });
      return;
    }

    if (step.role === "VP") {
      // Open VP steps are re-derived below from the threshold; drop the old one.
      return;
    }

    // Any other OPEN step (rate review, hand-picked office approver) that is
    // secretly the VP under one of his identities is not allowed under the
    // threshold either.
    if (!needVp && stepIsVp(step)) {
      changes.push(label + ": \"" + (step.label || step.role) + "\" step removed — " +
        (step.name || "the VP") + " is the VP and $" + amtNum.toLocaleString() +
        " is under the " + thr + " VP threshold");
      return;
    }

    newSteps.push(step);                                 // RATE_REVIEW, OFFICE_n
  });

  // ---- Threshold reconciliation on the rebuilt open portion ----
  const passedSlice = (chain.steps || []).slice(0, curIdx);
  const hadOpenVp = (chain.steps || []).some((st, i) => i >= curIdx && st.role === "VP");

  // DM missing but now available (directory hire or Settings stand-in), and
  // the chain hasn't passed where the DM would sit (its first stage):
  let dmPrepended = false;
  if (effAcs.length &&
      !(chain.steps || []).some(st => st.role === "AREA_COACH") &&
      curIdx === 0 && (chain.history || []).every(h => h.action !== "APPROVE")) {
    dmPrepended = true;
    const nameJoin = effAcs.map(nameOf).join(" or ");
    newSteps.unshift({
      role: "AREA_COACH", label: "District Manager (DM)",
      userIds: effAcs, userId: effAcs[0], name: nameJoin,
      hint: undefined, note: "Has this work been completed?"
    });
    changes.push(label + ": District Manager step added — " + nameJoin +
      " now covers this store");
  }

  // Director missing but now warranted: store has a DO, the amount clears
  // their threshold, and no DIRECTOR stage exists or has passed.
  if (newDirId &&
      !(chain.steps || []).some(st => st.role === "DIRECTOR") &&
      !newSteps.some(st => st.role === "DIRECTOR") &&
      amtNum >= directorThresholdFor(newDirId)) {
    const dirStep = {
      role: "DIRECTOR", label: "Director of Ops",
      userIds: [newDirId], userId: newDirId, name: nameOf(newDirId)
    };
    newSteps.push(dirStep);
    changes.push(label + ": Director step added — " + nameOf(newDirId) +
      " now covers this store" +
      (directorThresholdFor(newDirId) > 0
        ? " and $" + amtNum.toLocaleString() + " meets their $" +
          directorThresholdFor(newDirId).toLocaleString() + " threshold" : ""));
  }

  // VP step: present exactly when the total is at/above the live threshold and
  // he isn't already in the open portion under another identity. Always last.
  if (needVp) {
    if (!newSteps.some(st => !passedSlice.includes(st) && stepIsVp(st))) {
      const vpStep = makeVpStep();
      newSteps.push(vpStep);
      if (!hadOpenVp) {
        changes.push(label + ": VP step added — $" + amtNum.toLocaleString() +
          " is at or above the " + thr + " VP threshold");
      } else {
        // Re-derived the same open VP step: keep the ORIGINAL object so this
        // is not a change and does not restart his clock.
        const orig = (chain.steps || []).find((st, i) => i >= curIdx && st.role === "VP");
        newSteps[newSteps.length - 1] = orig;
      }
    } else if (hadOpenVp) {
      changes.push(label + ": VP step removed — " + vpDisplayName() +
        " already signs this chain under another step");
    }
  } else if (hadOpenVp) {
    changes.push(label + ": VP step removed — $" + amtNum.toLocaleString() +
      " is under the " + thr + " VP threshold");
  }

  if (!changes.length) return null;

  // Where does the chain wait now? Passed steps were pushed by reference, so
  // anything not in the passed slice is at-or-after the current stage.
  const passed = (chain.steps || []).slice(0, curIdx);
  let firstOpen = newSteps.find(st => !passed.includes(st));

  // Nobody is left to sign. Under the threshold the VP is NOT the fallback:
  //   - at least one approval already collected -> those signatures stand and
  //     the chain completes (the DM's sign-off is enough);
  //   - nothing collected at all -> nobody has looked at this invoice, so it
  //     is NOT auto-approved; it is reported for a stand-in DM/DO in Settings.
  // At/above the threshold the VP step was appended above, so this branch
  // only fires under it.
  if (!firstOpen) {
    const signed = (chain.history || []).some(h => h.action === "APPROVE");
    if (signed) {
      changes.push(label + ": no approvers remain and the total is under " + thr +
        " — completed with the signatures already collected");
      return { changes, autoApprove: true, newSteps };
    }
    return { skipped: "no District Manager or Director is left to approve it and " +
      "nobody has signed yet; the total ($" + amtNum.toLocaleString() + ") is under the " +
      thr + " VP threshold so it is not routed to " + vpDisplayName() +
      " — assign a stand-in in Settings → Incomplete approval paths" };
  }

  let newStage = newSteps.some(st => st.role === chain.currentStage)
    ? chain.currentStage : firstOpen.role;
  if (dmPrepended) newStage = "AREA_COACH";   // the chain restarts at the new DM

  const cur = newSteps.find(st => st.role === newStage);
  const oldCur = chain.steps[curIdx];
  if (newStage !== chain.currentStage ||
      JSON.stringify((cur.userIds || []).slice().sort()) !==
      JSON.stringify((oldCur.userIds || []).slice().sort())) {
    clockReset = true;
  }

  return {
    changes, clockReset,
    newChain: { ...chain, steps: newSteps, currentStage: newStage,
                stageEnteredAt: clockReset ? now : chain.stageEnteredAt }
  };
}

/* Chain integrity audit — the report-only companion to path repair. Catches
   what auto-repair can't or shouldn't fix by itself, so the AP team can
   verify EVERYTHING before declaring the system healthy:
   - legacy-format invoices (predate per-store chains; repair skips them)
   - open steps waiting on someone who no longer exists anywhere (the classic
     case: a hand-picked DPM Office approver who left the company)
   - pending chains with no SLA clock (stageEnteredAt missing — due dates
     and the overdue report can't see them)
   - invoice status that disagrees with its own chains (drift; auto-fixable
     and offered as a repair)
*/
function approverIdResolves(id, users) {
  if (!id) return false;
  if (users[id]) return true;
  if (String(id).indexOf("rate:") === 0) return true;      // config identities
  if (String(id).indexOf("admin:") === 0) return true;
  if (isVpIdentity(id)) return true;
  return false;
}

function auditChains(invoices, users) {
  const legacy = [], orphaned = [], noClock = [], drift = [];
  invoices.forEach(inv => {
    const chains = getChains(inv);
    if (chains.some(c => c._legacy)) { legacy.push(inv); return; }

    // Status drift applies to any invoice, open or closed.
    const expected = deriveStatus(chains);
    const eff = inv.status === "PAID" ? "PAID" : inv.status;   // PAID is finance's call, never drift
    if (eff !== "PAID" && expected !== inv.status) drift.push({ inv, expected });

    chains.forEach(chain => {
      if (chain.status !== "PENDING") return;
      const curIdx = (chain.steps || []).findIndex(st => st.role === chain.currentStage);
      (chain.steps || []).forEach((step, idx) => {
        if (idx < curIdx) return;                              // history
        const ids = step.userIds || [];
        if (!ids.length || !ids.some(id => approverIdResolves(id, users))) {
          orphaned.push({ inv, chain, step });
        }
      });
      if (!chain.stageEnteredAt) noClock.push({ inv, chain });
    });
  });
  return { legacy, orphaned, noClock, drift };
}

function buildPathRepairs(invoices, stores, users, now) {
  const byId = {}; stores.forEach(st => { byId[st.id] = st; });
  const out = [];
  invoices.forEach(inv => {
    if (inv.status !== "PENDING") return;
    const chains = getChains(inv);
    if (chains.some(c => c._legacy)) return;   // audited separately
    let touched = false, clockReset = false;
    const changes = [], skips = [];
    const newChains = chains.map(c => {
      const r = repairChainAgainstDirectory(c, byId[c.storeId], users, now, inv.amount);
      if (!r) return c;
      if (r.skipped) { skips.push((c.storeName || "store") + ": " + r.skipped); return c; }
      touched = true;
      changes.push(...r.changes);
      if (r.autoApprove) {
        return { ...c, steps: r.newSteps, status: "APPROVED",
                 currentStage: "APPROVED", stageEnteredAt: null };
      }
      clockReset = clockReset || r.clockReset;
      return r.newChain;
    });
    if (touched || skips.length) out.push({ inv, newChains, changes, skips, clockReset, touched });
  });
  return out;
}

const OFFICE_STORE_ID = "dpm-office";

/* DPM Office chains are hand-picked: Finance chooses the approvers, in
   order, and each becomes a sequential step. The house VP rule still holds —
   the live VP threshold appends the VP unless he's already chosen. */
function officeApproverOptions(users) {
  const opts = [];
  Object.values(users || {}).forEach(u => {
    if (u.role === "AREA_COACH" || u.role === "DIRECTOR") {
      opts.push({ key: u.id, ids: [u.id], name: u.name, roleLabel: roleLabel(u.role) });
    }
  });
  // Usman signs from either identity; Rahim from his rate login.
  const it = CFG.rateReviewers.IT, ra = CFG.rateReviewers.RAHIM;
  opts.push({ key: it.id, ids: [it.id, "admin:" + it.email.toLowerCase()],
              name: it.name, roleLabel: "IT" });
  opts.push({ key: ra.id, ids: [ra.id], name: ra.name, roleLabel: "Rate Approver" });
  return opts.sort((a, b) => a.name.localeCompare(b.name));
}

function buildOfficeChain(approverKeys, amount, users, now) {
  const opts = officeApproverOptions(users);
  const byKey = {}; opts.forEach(o => { byKey[o.key] = o; });
  const chosen = (approverKeys || []).map(k => byKey[k]).filter(Boolean);

  const steps = chosen.map((o, i) => ({
    role: "OFFICE_" + (i + 1),
    label: "Approver " + (i + 1) + (o.roleLabel ? " · " + o.roleLabel : ""),
    userIds: o.ids, userId: o.ids[0], name: o.name
  }));

  if (vpRequired(amount)) {
    if (!steps.some(stepIsVp)) steps.push(makeVpStep());
  }

  return {
    storeId: OFFICE_STORE_ID, storeName: "DPM Office", storeNumber: "",
    entity: "Dossani Paradise Management", division: "Office",
    steps,
    status: steps.length ? "PENDING" : "REJECTED",
    currentStage: steps.length ? steps[0].role : "NONE",
    stageEnteredAt: steps.length ? now : null,
    history: []
  };
}

function chainCurrentStep(chain) {
  return (chain.steps || []).find(s => s.role === chain.currentStage) || null;
}

/* How an approver relates to an invoice, alias-aware:
   ANY      — appears on any step or has signed anything (past or present)
   WAITING  — a pending chain sits at their step right now
   APPROVED — they approved at least one chain
   REJECTED — they rejected at least one chain */
/* Everything a person might remember about an invoice, searchable: vendor,
   number, amount, every store name/number, every approver who is or was on
   it, whoever filed and paid it, and the conversation (comments and
   approval/rejection notes written after this feature shipped — older
   comments predate the searchable copy). */
function invoiceSearchHaystack(inv) {
  const parts = [inv.vendor, inv.invoiceNumber, inv.storeName, inv.division,
    inv.entity, inv.createdByName, inv.paidByName, String(inv.amount || "")];
  getChains(inv).forEach(c => {
    parts.push(c.storeName, c.storeNumber, c.division, c.entity);
    (c.steps || []).forEach(st => { parts.push(st.name, st.label); });
    (c.history || []).forEach(h => { if (h) parts.push(h.byName); });
  });
  (inv.commentLog || []).forEach(e => { if (e && e.text) parts.push(e.text); });
  return parts.filter(Boolean).join(" § ").toLowerCase();
}
function invoiceMatchesQuery(inv, q) {
  if (!q) return true;
  return invoiceSearchHaystack(inv).includes(String(q).toLowerCase());
}

function invoiceApproverRelation(inv, approverId, rel) {
  // Expand a bare dropdown id to every identity that same human signs under:
  // the VP's full alias set, and rate-reviewer <-> admin id pairs.
  const mine = isVpIdentity(approverId) ? vpIdentityIds().slice() : [approverId];
  Object.values(CFG.rateReviewers || {}).forEach(r => {
    if (!r) return;
    const adminId = "admin:" + (r.email || "").toLowerCase();
    if (approverId === r.id || approverId === adminId) {
      if (!mine.includes(r.id)) mine.push(r.id);
      if (!mine.includes(adminId)) mine.push(adminId);
    }
  });
  const chains = getChains(inv);
  const inHistory = act => chains.some(c =>
    (c.history || []).some(h => h && h.action === act && mine.includes(h.by)));
  if (rel === "APPROVED") return inHistory("APPROVE");
  if (rel === "REJECTED") return inHistory("REJECT");
  if (rel === "WAITING")
    return chains.some(c => canActOnChain({ id: approverId, ids: mine }, c));
  // ANY: on any step of any chain, or anywhere in the signing history.
  return chains.some(c =>
    (c.steps || []).some(st => (st.userIds || []).some(id => mine.includes(id)))) ||
    inHistory("APPROVE") || inHistory("REJECT");
}

function canActOnChain(user, chain) {
  if (!user || !chain) return false;
  if (chain.status !== "PENDING") return false;
  const step = chainCurrentStep(chain);
  if (!step) return false;
  const mine = identityIdsFor(user);
  return (step.userIds || [step.userId]).some(id => mine.includes(id));
}

// True when the user is named on ANY step of the invoice, under any identity.
function userNamedOn(user, inv) {
  const mine = identityIdsFor(user);
  return getChains(inv).some(c =>
    (c.steps || []).some(s => (s.userIds || [s.userId]).some(id => mine.includes(id))));
}

// True when the user can act on at least one chain of the invoice.
function canUserAct(user, inv) {
  if (!inv || inv.status === "PAID") return false;
  return getChains(inv).some(c => canActOnChain(user, c));
}

/* ============================================================
   2b. IDENTITY — email + role password
   The email is resolved against the LIVE directory; the password
   only proves which role you hold. Nobody's identity is hardcoded,
   so people added to the directory can sign in immediately.
   ============================================================ */

function resolveSession(email, pw, dir) {
  const lc = (email || "").trim().toLowerCase();
  if (!lc || !pw) return { error: "Enter your email and password." };

  const P = CFG.rolePasswords;
  const emailOf = o => (o && o.email ? o.email : "").toLowerCase();

  // 1. Admin — full view, can impersonate anyone.
  if (CFG.adminEmails.map(e => e.toLowerCase()).includes(lc)) {
    if (pw !== P.admin) return { error: "That password doesn't match the admin role." };
    return { id: "admin:" + lc, email: lc, name: "IT Support", role: "ADMIN", scope: "all" };
  }

  // 1b. Rahim — rate reviewer on most vendors. Same password as admin per
  //     request, but a separate, non-admin session whose id matches the id
  //     that chains embed for the rate step.
  if (lc === CFG.rateReviewers.RAHIM.email.toLowerCase()) {
    if (pw !== P.admin) return { error: "That password doesn't match this role." };
    return { id: CFG.rateReviewers.RAHIM.id, email: lc,
             name: CFG.rateReviewers.RAHIM.name, role: "RATE_REVIEWER", scope: "self" };
  }

  // 1c. VP of Ops. His email is whatever FindMi has on his Support Staff
  //     record (dir.vp, resolved at load); the VP password proves the role.
  //     The session id is the id VP steps are embedded under, and `ids`
  //     carries every other FindMi id that is his, so he can act on a step
  //     filed under any of them. If he also holds another role's password
  //     (e.g. he is listed as a DM), that branch below still works.
  const vpInfo = (dir && dir.vp) || { ids: vpIdentityIds(), name: CFG.vp.name,
                                       email: (CFG.vp.email || "").toLowerCase() };
  const isVpEmail = !!vpInfo.email && lc === vpInfo.email;
  if (isVpEmail && pw === P.vp) {
    return { id: vpStepId(), ids: vpInfo.ids.slice(), email: lc,
             name: vpInfo.name, role: "VP", scope: "vp" };
  }

  // 2. Finance / AP. Directory first so that once these people are added
  //    upstream, the live record wins over the fallback list below.
  const dirFinance = Object.values(dir.users).find(
    u => emailOf(u) === lc && u.role === "FINANCE");
  if (dirFinance) {
    if (pw !== P.finance) return { error: "That password doesn't match the finance role." };
    return { id: dirFinance.id, email: lc, name: dirFinance.name, role: "FINANCE", scope: "all" };
  }
  const seeded = CFG.financeUsers.find(u => u.email.toLowerCase() === lc);
  if (seeded) {
    if (pw !== P.finance) return { error: "That password doesn't match the finance role." };
    return { id: "fin:" + lc, email: lc, name: seeded.name, role: "FINANCE", scope: "all" };
  }

  // 3. Director of Ops
  const director = Object.values(dir.users).find(
    u => emailOf(u) === lc && u.role === "DIRECTOR");
  if (director) {
    if (pw !== P.director) return { error: "That password doesn't match the director role." };
    return { id: director.id, email: lc, name: director.name, role: "DIRECTOR", scope: "director" };
  }

  // 4. Area Coach / District Manager
  const coach = Object.values(dir.users).find(
    u => emailOf(u) === lc && u.role === "AREA_COACH");
  if (coach) {
    if (pw !== P.coach) return { error: "That password doesn't match the district manager role." };
    return { id: coach.id, email: lc, name: coach.name, role: "AREA_COACH", scope: "stores" };
  }

  // 5. Store manager — matched on the store's own email address.
  const store = dir.stores.find(s => (s.email || "").toLowerCase() === lc);
  if (store) {
    if (pw !== P.manager) return { error: "That password doesn't match the store role." };
    return { id: "store:" + store.id, email: lc, name: store.storeManager || store.name,
             role: "MANAGER", scope: "single", storeId: store.id };
  }

  if (isVpEmail) return { error: "That password doesn't match the VP role." };
  return { error: "We couldn't find that email in the directory. Check it's the email on file." };
}

// Impersonated sessions use the SAME shape resolveSession returns, so the
// simulated view is exactly what that person would see.
function buildImpersonatedSession(u, dir) {
  if (u.kind === "store") {
    const s = dir.stores.find(x => x.id === u.id);
    if (!s) return null;
    return { id: "store:" + s.id, email: (s.email || "").toLowerCase(),
             name: s.storeManager || s.name, role: "MANAGER",
             scope: "single", storeId: s.id, _sim: true };
  }
  const person = dir.users[u.id];
  if (!person) return null;
  if (person.role === "VP" || isVpIdentity(person.id)) {
    const vpInfo = dir.vp || { ids: vpIdentityIds(), name: person.name, email: person.email };
    return { id: vpStepId(), ids: vpInfo.ids.slice(), email: (vpInfo.email || "").toLowerCase(),
             name: vpInfo.name || person.name, role: "VP", scope: "vp", _sim: true };
  }
  return { id: person.id, email: (person.email || "").toLowerCase(),
           name: person.name, role: person.role,
           scope: person.role === "DIRECTOR" ? "director" : "stores", _sim: true };
}

// Everyone an admin can view as.
function viewAsRoster(dir) {
  const rows = [];
  Object.values(dir.users).forEach(u => {
    rows.push({ kind: "user", id: u.id, primary: u.name,
                secondary: roleLabel(u.role),
                search: (u.name + " " + (u.email || "") + " " + u.role).toLowerCase() });
  });
  CFG.financeUsers.forEach(f => {
    if (Object.values(dir.users).some(u => (u.email || "").toLowerCase() === f.email.toLowerCase())) return;
    rows.push({ kind: "finance", id: "fin:" + f.email.toLowerCase(), primary: f.name,
                secondary: "Finance", search: (f.name + " " + f.email + " finance").toLowerCase() });
  });
  dir.stores.forEach(s => {
    rows.push({ kind: "store", id: s.id,
                primary: s.storeManager || "(no manager on file)",
                secondary: s.name,
                search: (s.name + " " + s.storeNumber + " " + (s.storeManager || "")).toLowerCase() });
  });
  return rows;
}

/* ============================================================
   3. SLA TIMER — business hours only
   Mon-Fri 08:00-17:00. Nights, weekends and configured holidays
   contribute nothing. The clock is NOT paused or reset by
   comments; it stops only when the approver approves or rejects,
   and restarts from zero for the next approver in the chain.
   Colour is always derived from stageEnteredAt, never stored, so
   it cannot go stale in the database.
   ============================================================ */
/* ============================================================
   LIVE THRESHOLDS — single source of truth is Firestore
   (doc "_config_thresholds" in the invoices collection), not
   this file. RUNTIME holds the last-received values; CFG only
   seeds the bootstrap default for the moments before the first
   snapshot arrives.
     vpThreshold          — invoices at/above this get the VP step.
     directorThresholds   — per-Director minimums, keyed by the
                            director's directory id. A Director is
                            SKIPPED on invoices under their number,
                            but only when a District Manager is on
                            the chain — a Director who is the only
                            approver stays regardless, so no invoice
                            is left with nobody.
   ============================================================ */
const RUNTIME = { vpThreshold: CFG.vpThreshold, directorThresholds: {},
                  pathOverrides: {} };

/* Path overrides fill the gaps FindMi leaves: a store with no DM or no DO
   can have a chosen stand-in, stored in Firestore and read live. FindMi
   always wins when it HAS someone — overrides apply ONLY to the missing
   slot, so fixing the directory later automatically retires the override. */
function applyPathOverrides(doc) {
  RUNTIME.pathOverrides = (doc && doc.overrides) || {};
}
function effectiveAcIds(store) {
  const real = (store.acIds || []);
  if (real.length) return real;
  const ov = RUNTIME.pathOverrides[store.id];
  return ov && ov.dm ? [ov.dm] : [];
}
function effectiveDirectorId(store) {
  if (store.directorId) return store.directorId;
  const ov = RUNTIME.pathOverrides[store.id];
  return (ov && ov.do) || null;
}

function applyThresholdConfig(doc) {
  RUNTIME.vpThreshold = (doc && Number(doc.vpThreshold) > 0)
    ? Number(doc.vpThreshold) : CFG.vpThreshold;
  RUNTIME.directorThresholds = (doc && doc.directorThresholds) || {};
}

function getVpThreshold() { return RUNTIME.vpThreshold; }
function directorThresholdFor(directorId) {
  const v = Number((RUNTIME.directorThresholds || {})[directorId]);
  return isFinite(v) && v > 0 ? v : 0;      // 0 = involved on everything
}

const BH = CFG.businessHours;

function isBusinessDay(d) {
  if (!BH.days.includes(d.getDay())) return false;
  const iso = d.getFullYear() + "-" +
              String(d.getMonth() + 1).padStart(2, "0") + "-" +
              String(d.getDate()).padStart(2, "0");
  return !(BH.holidays || []).includes(iso);
}

// Minutes of business time between two instants.
function businessMinutesBetween(from, to) {
  if (to <= from) return 0;
  let mins = 0;
  const cur = new Date(from);
  let guard = 0;
  while (cur < to && guard++ < 4000) {
    if (isBusinessDay(cur)) {
      const open  = new Date(cur); open.setHours(BH.startHour, 0, 0, 0);
      const close = new Date(cur); close.setHours(BH.endHour, 0, 0, 0);
      const s = cur > open ? cur : open;
      const e = to < close ? to : close;
      if (e > s) mins += (e - s) / 60000;
    }
    cur.setDate(cur.getDate() + 1);
    cur.setHours(0, 0, 0, 0);
  }
  return mins;
}

// The instant at which `minutes` of business time will have elapsed.
function addBusinessMinutes(from, minutes) {
  let left = minutes;
  const cur = new Date(from);
  let guard = 0;
  while (left > 0 && guard++ < 4000) {
    if (isBusinessDay(cur)) {
      const open  = new Date(cur); open.setHours(BH.startHour, 0, 0, 0);
      const close = new Date(cur); close.setHours(BH.endHour, 0, 0, 0);
      const s = cur > open ? new Date(cur) : open;
      if (s < close) {
        const avail = (close - s) / 60000;
        if (avail >= left) return new Date(s.getTime() + left * 60000);
        left -= avail;
      }
    }
    cur.setDate(cur.getDate() + 1);
    cur.setHours(0, 0, 0, 0);
  }
  return new Date(from + minutes * 60000);
}

// Hours in one full business day, derived from the configured window.
const BIZ_DAY_HOURS = BH.endHour - BH.startHour;
const SLA_HOURS = CFG.slaDays * BIZ_DAY_HOURS;

function slaState(inv, now) {
  if (!inv.stageEnteredAt || inv.status !== "PENDING") return null;
  const usedH = businessMinutesBetween(new Date(inv.stageEnteredAt), new Date(now)) / 60;
  const remainingH = SLA_HOURS - usedH;
  const dueAt = addBusinessMinutes(new Date(inv.stageEnteredAt), SLA_HOURS * 60);
  let level = "ok";
  if (usedH >= SLA_HOURS) level = "late";
  else if (usedH >= SLA_HOURS / 2) level = "warn";
  // Outside working hours the clock is frozen — worth showing so an approver
  // doesn't think the display is broken.
  const paused = !isBusinessDay(new Date(now)) ||
                 new Date(now).getHours() < BH.startHour ||
                 new Date(now).getHours() >= BH.endHour;
  return {
    usedH, remainingH, level, dueAt, paused,
    usedDays: usedH / BIZ_DAY_HOURS,
    remainingDays: remainingH / BIZ_DAY_HOURS
  };
}

// Everything users see is in business days — never hours.
function dayWord(n) { return n === 1 ? "day" : "days"; }

// Human phrase for the SLA window, used in banners and tooltips.
const SLA_PHRASE = CFG.slaDays + " business " + dayWord(CFG.slaDays);

function fmtDueShort(d) {
  return d.toLocaleString(undefined,
    { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function slaLabel(s) {
  if (!s) return "";
  if (s.level === "late") return "Overdue — was due " + fmtDueShort(s.dueAt);
  return "Approval due by " + fmtDueShort(s.dueAt);
}

function slaTitle(s) {
  if (!s) return "";
  const due = s.dueAt.toLocaleString(undefined,
    { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  return "Due " + due + " · " + SLA_PHRASE + " (Mon-Fri " + BH.startHour + ":00-" + BH.endHour + ":00)" +
         (s.paused ? " · clock paused outside working hours" : "");
}

/* ============================================================
   4. INVOICE SERVICE — Firestore
   Same method names as the old Supabase service so the UI that
   gets ported later needs no changes.
   ============================================================ */
// Firestore rejects `undefined` anywhere in a document. Strip it before
// every write so one optional field can never sink a submission again.
function cleanForFirestore(obj) {
  return JSON.parse(JSON.stringify(obj));
}

/* ============================================================
   REPORT ROWS — one row per STORE CHAIN, filtered by date range,
   status, vendor, DM, and DO. A row qualifies for the date range
   when ANY of its events (created, any decision, paid) falls on
   or between the selected dates, inclusive.
   ============================================================ */
function decisionFor(chain, role) {
  const h = [...(chain.history || [])].reverse()
    .find(x => x.stage === role && (x.action === "APPROVE" || x.action === "REJECT"));
  const step = (chain.steps || []).find(st => st.role === role);
  return {
    name: h ? h.byName : (step ? step.name : ""),
    action: h ? (h.action === "APPROVE" ? "Approved" : "Rejected") : (step ? "Pending" : ""),
    date: h ? new Date(h.ts).toLocaleString() : "",
    note: h ? (h.note || "") : ""
  };
}

function effectiveChainStatus(inv, chain) {
  if (inv.status === "PAID" && chain.status === "APPROVED") return "PAID";
  return chain.status;
}

/* One row per PENDING chain that has blown its window — a snapshot of who
   is sitting on what, right now. Sorted most-overdue first. */
/* ============================================================
   PAID INSIGHTS — "how much did we pay this vendor in April?"
   Month bucket: the date Finance pressed Mark Paid; older records
   without paidAt fall back to their last update / creation.
   Store attribution: an invoice's amount is split EVENLY across
   its approved chains, so multi-store invoices don't double-count
   (a $900 invoice paid across 3 stores adds $300 to each).
   Each chart ignores its own filter (so you can always switch
   month/vendor/store) but respects the other two.
   ============================================================ */
function paidMonthKey(inv) {
  const t = inv.paidAt || inv.updatedAt || inv.createdAt;
  if (!t) return "";
  const d = new Date(t);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function monthLabel(key) {
  const [y, m] = key.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "short", year: "numeric" });
}

function buildPaidInsights(invoices, sel) {
  sel = sel || {};
  const vendorKey = v => (v || "").trim().toLowerCase();
  const paid = invoices.filter(i => i.status === "PAID");
  const matchMonth  = i => !sel.month  || paidMonthKey(i) === sel.month;
  const matchVendor = i => !sel.vendor || vendorKey(i.vendor) === sel.vendor;
  const matchStore  = i => !sel.store  ||
    getChains(i).some(c => c.storeId === sel.store);

  const months = {};                       // respects vendor+store, not month
  paid.filter(i => matchVendor(i) && matchStore(i)).forEach(i => {
    const k = paidMonthKey(i);
    if (k) months[k] = (months[k] || 0) + (Number(i.amount) || 0);
  });

  const vendors = {};                      // respects month+store, not vendor
  paid.filter(i => matchMonth(i) && matchStore(i)).forEach(i => {
    const k = (i.vendor || "").trim() || "(no vendor)";
    vendors[k] = (vendors[k] || 0) + (Number(i.amount) || 0);
  });

  const stores = {};                       // respects month+vendor, not store
  paid.filter(i => matchMonth(i) && matchVendor(i)).forEach(i => {
    const ch = getChains(i);
    const approvedChains = ch.filter(c => c.status === "APPROVED");
    const share = approvedChains.length
      ? (Number(i.amount) || 0) / approvedChains.length : 0;
    (approvedChains.length ? approvedChains : ch).forEach(c => {
      const key = c.storeId || c.storeName || "?";
      if (!stores[key]) stores[key] = { id: c.storeId, name: c.storeName || "(store)", total: 0 };
      stores[key].total += approvedChains.length ? share
        : (Number(i.amount) || 0) / (ch.length || 1);
    });
  });

  const inSel = paid.filter(i => matchMonth(i) && matchVendor(i) && matchStore(i));
  return {
    months: Object.entries(months).sort((a, b) => a[0] < b[0] ? -1 : 1)
      .map(([key, total]) => ({ key, label: monthLabel(key), total })),
    vendors: Object.entries(vendors).map(([name, total]) => ({ name, total }))
      .sort((a, b) => b.total - a.total),
    stores: Object.values(stores).sort((a, b) => b.total - a.total),
    grand: { total: inSel.reduce((n, i) => n + (Number(i.amount) || 0), 0),
             count: inSel.length }
  };
}

function buildOverdueRows(invoices, now) {
  const rows = [];
  invoices.forEach(inv => {
    getChains(inv).forEach(chain => {
      if (chain.status !== "PENDING") return;
      const sla = slaState(chain, now);
      if (!sla || sla.level !== "late") return;
      const step = chainCurrentStep(chain);
      const hoursPerDay = BH.endHour - BH.startHour;
      const overH = Math.max(0, sla.usedH - SLA_HOURS);
      rows.push({
        _overH: overH,
        "Waiting On": step ? step.name : "",
        "Role": step ? step.label : chain.currentStage,
        "Overdue By": overH >= hoursPerDay
          ? (overH / hoursPerDay).toFixed(1) + " business days"
          : overH.toFixed(1) + " business hours",
        "Was Due": sla.dueAt ? new Date(sla.dueAt).toLocaleString() : "",
        "Vendor": inv.vendor || "",
        "Invoice #": inv.invoiceNumber || "",
        "Amount": Number(inv.amount) || 0,
        "Store": chain.storeName || "",
        "Store #": chain.storeNumber || "",
        "Division": chain.division || "",
        "Stage Since": chain.stageEnteredAt ? new Date(chain.stageEnteredAt).toLocaleString() : "",
        "Invoice Created": inv.createdAt ? new Date(inv.createdAt).toLocaleString() : "",
        "Created By": inv.createdByName || ""
      });
    });
  });
  rows.sort((a, b) => b._overH - a._overH);
  rows.forEach(r => { delete r._overH; });
  return rows;
}

function buildReportRows(invoices, f) {
  // f: { startMs, endMs, statuses:Set, vendor, dmId, doId }
  const rows = [];
  invoices.forEach(inv => {
    getChains(inv).forEach(chain => {
      // Date: any event in range.
      const events = [inv.createdAt, inv.paidAt,
                      ...(chain.history || []).map(h => h.ts)].filter(Boolean);
      if (f.startMs != null && f.endMs != null &&
          !events.some(t => t >= f.startMs && t <= f.endMs)) return;

      const status = effectiveChainStatus(inv, chain);
      if (f.statuses && f.statuses.size && !f.statuses.has(status)) return;

      if (f.vendor && (inv.vendor || "") !== f.vendor) return;

      const dmStep = (chain.steps || []).find(st => st.role === "AREA_COACH");
      const doStep = (chain.steps || []).find(st => st.role === "DIRECTOR");
      if (f.dmId && !(dmStep && (dmStep.userIds || []).includes(f.dmId))) return;
      if (f.doId && !(doStep && (doStep.userIds || []).includes(f.doId))) return;

      const dm = decisionFor(chain, "AREA_COACH");
      const rc = decisionFor(chain, "RATE_REVIEW");
      const dO = decisionFor(chain, "DIRECTOR");
      const vp = decisionFor(chain, "VP");

      rows.push({
        "Invoice #": inv.invoiceNumber || "",
        "Vendor": inv.vendor || "",
        "Amount": Number(inv.amount) || 0,
        "Store": chain.storeName || "",
        "Store #": chain.storeNumber || "",
        "Entity": chain.entity || "",
        "Division": chain.division || "",
        "DM": dm.name, "DM Decision": dmStep ? dm.action : "N/A",
        "DM Decision Date": dm.date,
        "Rate Approver": rc.name,
        "Rate Decision": (chain.steps || []).some(st => st.role === "RATE_REVIEW") ? rc.action : "N/A",
        "Rate Decision Date": rc.date,
        "DO": dO.name, "DO Decision": doStep ? dO.action : "N/A",
        "DO Decision Date": dO.date,
        "VP Decision": (chain.steps || []).some(st => st.role === "VP") ? vp.action : "N/A",
        "VP Decision Date": vp.date,
        "Rejection Comment": [dm, rc, dO, vp].map(x => x.note).filter(Boolean).join(" | "),
        "Chain Status": chain.status,
        "Invoice Status": inv.status,
        "Created By": inv.createdByName || inv.createdBy || "",
        "Created Date": inv.createdAt ? new Date(inv.createdAt).toLocaleString() : "",
        "Paid Date": inv.paidAt ? new Date(inv.paidAt).toLocaleString() : ""
      });
    });
  });
  return rows;
}

/* ============================================================
   FIRESTORE SELF-TEST
   The SDK retries "backend unavailable" silently forever, which
   makes a missing database look like a hung save. The REST API
   answers honestly: 404 NOT_FOUND = the database was never
   created; 403 = rules are blocking; 200 = healthy.
   ============================================================ */
async function probeFirestore() {
  const pid = CFG.firebase.projectId;
  const url = "https://firestore.googleapis.com/v1/projects/" + pid +
              "/databases/(default)/documents/invoices?pageSize=1&key=" + CFG.firebase.apiKey;
  try {
    const res = await fetch(url);
    const body = await res.json().catch(() => ({}));
    const status = body && body.error && body.error.status;
    if (res.ok) return { ok: true, verdict: "healthy",
      message: "Firestore is reachable and readable." };
    if (status === "NOT_FOUND" || res.status === 404) return { ok: false, verdict: "no-database",
      message: "No Firestore database exists for project \"" + pid + "\". " +
        "This project was auto-created for an API key and never got a database. " +
        "Fix: open console.firebase.google.com → select this project → Build → " +
        "Firestore Database → Create database. Until then, every save will hang." };
    if (status === "PERMISSION_DENIED" || res.status === 403) return { ok: false, verdict: "rules",
      message: "The database exists but security rules are blocking access. " +
        "Fix: Firebase console → Firestore Database → Rules — for testing you can " +
        "allow read/write, then lock down before go-live." };
    return { ok: false, verdict: "other",
      message: "Firestore responded with an unexpected error (" + res.status + "): " +
        ((body.error && body.error.message) || "unknown") };
  } catch (e) {
    return { ok: false, verdict: "network",
      message: "Couldn't reach firestore.googleapis.com at all — a VPN, proxy, " +
        "or ad-blocker is blocking it. (" + (e.message || "network error") + ")" };
  }
}

const VENDOR_RULES_DOC = "_config_vendorRules";
const THRESHOLDS_DOC   = "_config_thresholds";
const PATH_OVERRIDES_DOC = "_config_pathOverrides";

const pathOverridesService = {

    });

const vendorRulesService = {

    });

const invoiceService = {
  _col() { return window.FS.collection(window.FS.db, "invoices"); },

  subscribe(cb, onErr) {
    const q = window.FS.query(this._col(), window.FS.orderBy("createdAt", "desc"));
    return window.FS.onSnapshot(q,
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err  => onErr && onErr(err));
  },

  async create(inv) {
    // If the write can't reach Firestore it retries silently forever; surface
    // that as an error instead of a button stuck on "Saving…".
    const write = window.FS.addDoc(this._col(), cleanForFirestore(inv));
    const timeout = new Promise((_, rej) => setTimeout(() =>
      rej(new Error("The save didn't reach the database within 20 seconds. " +
                    "Check your connection (VPNs, proxies, and ad-blockers can block Firestore) and try again.")), 20000));
    const ref = await Promise.race([write, timeout]);
    return ref.id;
  },

  async update(id, patch) {
    await window.FS.updateDoc(window.FS.doc(window.FS.db, "invoices", id),
      cleanForFirestore(patch));
  },

  async remove(id) {
    await window.FS.deleteDoc(window.FS.doc(window.FS.db, "invoices", id));
  }
};

/* ============================================================
   4b. COMMENTS — invoices/{id}/comments subcollection
   Kept out of the invoice document so that a long thread cannot
   push the doc toward Firestore's 1MB ceiling, and so two people
   posting at once don't overwrite each other.
   Commenting never touches stageEnteredAt: the SLA clock is not
   affected by discussion, only by Approve/Reject.
   ============================================================ */
const commentService = {
  _col(invoiceId) {
    return window.FS.collection(window.FS.db, "invoices", invoiceId, "comments");
  },

  subscribe(invoiceId, cb, onErr) {
    const q = window.FS.query(this._col(invoiceId), window.FS.orderBy("ts", "asc"));
    return window.FS.onSnapshot(q,
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err  => onErr && onErr(err));
  },

  async add(invoiceId, author, text, inv, meta) {
    const ts = Date.now();
    await window.FS.addDoc(this._col(invoiceId), {
      userId: author.id,
      userName: author.name,
      userRole: author.role,
      text: String(text).trim(),
      action: (meta && meta.action) || null,       // "APPROVE" | "REJECT" | null
      storeName: (meta && meta.storeName) || null, // which chain the action was on
      ts
    });
    // Denormalize onto the invoice doc so notification counts are computable
    // from a single document read (the repair app reads these over REST).
    const log = [...((inv && inv.commentLog) || []),
      { ts, by: author.id, text: String(text).trim().slice(0, 500) }];
    await invoiceService.update(invoiceId, { commentLog: log, lastCommentAt: ts });
  },

  async markRead(invoiceId, userId) {
    await window.FS.updateDoc(window.FS.doc(window.FS.db, "invoices", invoiceId),
      { ["commentReads." + userId]: Date.now() });
  }
};

/* ============================================================
   5. FILESTACK — PDF upload
   ============================================================ */
// The Filestack script is a separate CDN request, so it may not have parsed by
// the time this component first renders. Retry briefly instead of permanently
// deciding uploads are unavailable on the first paint.
function useFilestack() {
  const ref = useRef(null);
  const [, bump] = useState(0);

  useEffect(() => {
    if (ref.current) return;
    let tries = 0;
    const t = setInterval(() => {
      if (window.filestack && CFG.filestackApiKey &&
          !CFG.filestackApiKey.startsWith("PASTE_")) {
        try {
          ref.current = window.filestack.init(CFG.filestackApiKey);
          bump(n => n + 1);
        } catch (e) { /* leave null; the picker reports it */ }
        clearInterval(t);
      } else if (++tries > 40) {          // ~10s
        clearInterval(t);
        bump(n => n + 1);
      }
    }, 250);
    return () => clearInterval(t);
  }, []);

  return ref.current;
}

function FilterGroup({ label, children }) {
